# Build and test Liminal Amp; for a v* tag, make a DRAFT release with the zips (test on a device, then publish).
# Release files: Liminal-Amp-<v>-mpc-sdk.zip (MPC OS 3.10.1+, one folder for every MPC: copy into "VST2 Plugins"),
# Liminal-Amp-<v>-mpc-armv7.zip / -mpc-aarch64.zip (the MPC OS Plugin Catalog's packages), SHA256SUMS.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  MPC_VST_REPO: open-mpc/mpc-vst-plugins        # (was sd88me/mpc-vst-plugins: moved, same history) page generator and plugin-list entry (pinned: the page tested on a device)
  MPC_VST_REF: 3e50b052268d81e6c61a17a1390ced62f0fdff74
  MPC_VST_RELEASE_REF: 009353816044739537adab030927fe9765af67f1   # release.py, catalog_check.py, sdk_zip.py: plugin.json (MPC OS 3.10.1), Gen 2
  AKAI_SDK_REPO: inmusic-software/mpc-plugin-builder-sdk           # Akai's MPC Plugin SDK: host_sim and validate.py check the 3.10.1 folder
  AKAI_SDK_REF: febd2ca5bd9eb16c4a412837196e145566bc981b

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: mpc-vst-liminal-amp
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.MPC_VST_REPO }}
          ref: ${{ env.MPC_VST_REF }}
          path: mpc-vst-plugins
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.MPC_VST_REPO }}
          ref: ${{ env.MPC_VST_RELEASE_REF }}
          path: mpc-vst-plugins-release
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.AKAI_SDK_REPO }}
          ref: ${{ env.AKAI_SDK_REF }}
          path: akai-sdk
      - name: Tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libeigen3-dev libcurl4-openssl-dev curl qemu-user libc6-armhf-cross libc6-arm64-cross zip
          pip install --break-system-packages ziglang==0.16.0 pillow
          pip install --break-system-packages playwright   # the page's browser renderer (vst.json "art": "html")
          python3 -m playwright install --with-deps chromium
      - name: Build (device plugin, armhf)
        working-directory: mpc-vst-liminal-amp
        env:
          MPC_VST: ${{ github.workspace }}/mpc-vst-plugins
        run: vst/build.sh
      - name: Test (library, IR vs official, engine, plugin)
        working-directory: mpc-vst-liminal-amp
        env:
          MPC_VST: ${{ github.workspace }}/mpc-vst-plugins
        run: vst/build.sh host && tools/test.sh
      - name: Test (AddressSanitizer + UBSan)
        working-directory: mpc-vst-liminal-amp
        env:
          MPC_VST: ${{ github.workspace }}/mpc-vst-plugins
          SANITIZE: asan
        run: tools/test.sh
      - name: Test (ThreadSanitizer)
        working-directory: mpc-vst-liminal-amp
        env:
          MPC_VST: ${{ github.workspace }}/mpc-vst-plugins
          SANITIZE: tsan
        run: tools/test.sh
      - name: Test (the device .so under qemu-arm)
        working-directory: mpc-vst-liminal-amp
        env:
          MPC_VST: ${{ github.workspace }}/mpc-vst-plugins
        run: vst/build.sh host && ARM=1 tools/test.sh
      - name: Build and test Gen 2 (aarch64, under qemu-aarch64)
        working-directory: mpc-vst-liminal-amp
        env:
          MPC_VST: ${{ github.workspace }}/mpc-vst-plugins
        run: vst/build.sh aarch64 && vst/build.sh host && ARM64=1 tools/test.sh
      - name: Package (the MPC OS 3.10.1 folder zip, catalog zips for Gen 1 and Gen 2, checked by catalog_check.py)
        working-directory: mpc-vst-liminal-amp
        env:
          MPC_VST: ${{ github.workspace }}/mpc-vst-plugins
          MPC_VST_RELEASE: ${{ github.workspace }}/mpc-vst-plugins-release
        run: vst/build.sh && vst/build.sh aarch64 && tools/package.sh
      - name: Akai SDK checks (host_sim on the PC builds and both device binaries under qemu, validate.py on the 3.10.1 folder)
        working-directory: mpc-vst-liminal-amp
        env:
          MPC_VST: ${{ github.workspace }}/mpc-vst-plugins
          AKAI_SDK: ${{ github.workspace }}/akai-sdk
          ARM: "1"
        run: vst/build.sh host && vst/build.sh zighost && tools/akai_check.sh
      - name: Tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: mpc-vst-liminal-amp
        run: test "v$(cat VERSION)" = "${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v4
        with:
          name: Liminal-Amp
          path: |
            mpc-vst-liminal-amp/dist/*.zip
            mpc-vst-liminal-amp/dist/SHA256SUMS
      - name: Release (draft)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          body_path: mpc-vst-liminal-amp/dist/RELEASE_NOTES.md
          files: |
            mpc-vst-liminal-amp/dist/*.zip
            mpc-vst-liminal-amp/dist/SHA256SUMS

permissions:
  contents: write
