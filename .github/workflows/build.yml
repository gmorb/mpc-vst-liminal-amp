# Build and test Liminal Amp; for a v* tag, make a DRAFT release with the zips (test on a device, then publish).
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  MPC_VST_REPO: sd88me/mpc-vst-plugins          # page generator and plugin-list entry (pinned: the page tested on a device)
  MPC_VST_REF: 3e50b052268d81e6c61a17a1390ced62f0fdff74
  MPC_VST_RELEASE_REF: 7c4bf25dd9947eba3f1bf2d8b176bafdcd6a2ae0   # release.py + catalog_check.py: Gen 2 (aarch64) zips

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: mpc-vst-liminal-amp
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.MPC_VST_REPO }}
          ref: ${{ env.MPC_VST_REF }}
          path: mpc-vst-plugins
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.MPC_VST_REPO }}
          ref: ${{ env.MPC_VST_RELEASE_REF }}
          path: mpc-vst-plugins-release
      - name: Tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libeigen3-dev libcurl4-openssl-dev curl qemu-user libc6-armhf-cross libc6-arm64-cross zip
          pip install --break-system-packages ziglang==0.16.0 pillow
          pip install --break-system-packages playwright   # the page's browser renderer (vst.json "art": "html")
          python3 -m playwright install --with-deps chromium
      - name: Build (device plugin, armhf)
        working-directory: mpc-vst-liminal-amp
        env:
          MPC_VST: ${{ github.workspace }}/mpc-vst-plugins
        run: vst/build.sh
      - name: Test (library, IR vs official, engine, plugin)
        working-directory: mpc-vst-liminal-amp
        env:
          MPC_VST: ${{ github.workspace }}/mpc-vst-plugins
        run: vst/build.sh host && tools/test.sh
      - name: Test (AddressSanitizer + UBSan)
        working-directory: mpc-vst-liminal-amp
        env:
          MPC_VST: ${{ github.workspace }}/mpc-vst-plugins
          SANITIZE: asan
        run: tools/test.sh
      - name: Test (ThreadSanitizer)
        working-directory: mpc-vst-liminal-amp
        env:
          MPC_VST: ${{ github.workspace }}/mpc-vst-plugins
          SANITIZE: tsan
        run: tools/test.sh
      - name: Test (the device .so under qemu-arm)
        working-directory: mpc-vst-liminal-amp
        env:
          MPC_VST: ${{ github.workspace }}/mpc-vst-plugins
        run: vst/build.sh host && ARM=1 tools/test.sh
      - name: Build and test Gen 2 (aarch64, under qemu-aarch64)
        working-directory: mpc-vst-liminal-amp
        env:
          MPC_VST: ${{ github.workspace }}/mpc-vst-plugins
        run: vst/build.sh aarch64 && vst/build.sh host && ARM64=1 tools/test.sh
      - name: Package (distribution zip, catalog zips for Gen 1 and Gen 2, checked by catalog_check.py)
        working-directory: mpc-vst-liminal-amp
        env:
          MPC_VST: ${{ github.workspace }}/mpc-vst-plugins
          MPC_VST_RELEASE: ${{ github.workspace }}/mpc-vst-plugins-release
        run: vst/build.sh && vst/build.sh aarch64 && tools/package.sh
      - name: Tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: mpc-vst-liminal-amp
        run: test "v$(cat VERSION)" = "${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v4
        with:
          name: Liminal-Amp-for-MPC-OS
          path: |
            mpc-vst-liminal-amp/dist/*.zip
            mpc-vst-liminal-amp/dist/SHA256SUMS
      - name: Release (draft)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          body_path: mpc-vst-liminal-amp/dist/RELEASE_NOTES.md
          files: |
            mpc-vst-liminal-amp/dist/*.zip
            mpc-vst-liminal-amp/dist/SHA256SUMS

permissions:
  contents: write
