# Liminal Amp -- MPC page v3 (1280x628 plugin area; shadow coords = page y + 86). Browser renderer ("art": "html").
# The design system is Liminal Hz's (one page, dark, large type, a material under everything, one accent that means "a
# live value"); the identity is a guitar amp's. Two blocks, AMP (capture) and CAB (IR), each the TONE3000 entry point
# (Browse TONE3000) with the loaded tone's T3K mark, pack title, gear type, format and creator; the full TONE3000 logo
# is in the header, seen before the marks. Each block has a list (AMP LIST / CAB LIST: four to a page, tap to load) that
# opens over the block's body; everything it would cover is when=<block>_menu:0. Controls: input / tone / out, each with
# its switch above its knobs; the amp's and the cab's settings on the right.
